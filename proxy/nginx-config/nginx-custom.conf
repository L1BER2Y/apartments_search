limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80 default_server;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    limit_req_status 429;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @service_unavailable;

    location ~ ^/api/v1/users/(login|registration|verification)$ {
        limit_req zone=auth burst=5 nodelay;
        set $upstream http://user-service:8080;
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream;
    }

    location ~ ^/api/v1/users(/|$) {
        set $upstream http://user-service:8080;
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream;
    }

    location ~ ^/api/v1/audit(/|$) {
        set $upstream http://audit-service:8084;
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream;
    }

    location ~ ^/api/v1/report(/|$) {
        set $upstream http://report-service:8083;
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream;
    }

    location ~ ^/api/v1/flats(/|$) {
        set $upstream http://flats-service:8086;
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream;
    }

    location /swagger/ {
        set $upstream http://swagger-ui:8080;
        proxy_pass $upstream;
    }

    location / {
        default_type application/json;
        return 404 '{"logRef":"error","message":"Not found"}';
    }

    location @service_unavailable {
        default_type application/json;
        return 503 '{"logRef":"error","message":"Service is temporarily unavailable"}';
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"logRef":"error","message":"Too many requests. Try again later"}';
    }
}
